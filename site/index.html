        <h1>PolyMint — ساخت توکن ERC-20 روی Polygon بدون کدنویسی</h1>
        <p>PolyMint یک پلتفرم وب است که به شما امکان می‌دهد توکن ERC-20 اختصاصی خودتان را در چند ثانیه روی شبکه Polygon (پالیگان) بسازید. بدون نیاز به دانش برنامه‌نویسی، بدون استقرار قرارداد هوشمند پیچیده. کافیست نام توکن، نماد و عرضه کل را مشخص کنید، کارمزد کوچکی به صورت MATIC یا تتر بپردازید و توکن واقعی ERC-20 را مستقیماً در کیف پول خود دریافت کنید.</p>

        <h2>چگونه با PolyMint توکن بسازیم؟</h2>
        <ol>
          <li>کیف پول خود را وصل کنید (MetaMask یا Trust Wallet روی دسکتاپ و موبایل).</li>
          <li>نام توکن (مثلاً Sun Coin) و نماد (مثلاً SUN) را وارد کنید.</li>
          <li>عرضه کل توکن را مشخص کنید.</li>
          <li>کارمزد ساخت (۱۲.۵ MATIC) را با MATIC بپردازید.</li>
          <li>توکن ERC-20 شما ساخته می‌شود و آدرس قرارداد آن در Polygonscan قابل مشاهده است.</li>
        </ol>

        <h2>امکانات PolyMint</h2>
        <ul>
          <li>ساخت توکن ERC-20 استاندارد روی شبکه Polygon</li>
          <li>بدون کدنویسی — رابط کاربری ساده و فارسی</li>
          <li>پشتیبانی از ۸ زبان: فارسی، عربی، انگلیسی، کوردی، چینی، هندی، مالایی و آلمانی</li>
          <li>کارمزد پایین و رقابتی ۱۲.۵ MATIC</li>
          <li>پشتیبانی از کیف پول‌های MetaMask و Trust Wallet در مرورگر دسکتاپ و موبایل</li>
          <li>فهرست توکن‌های ساخته‌شده مستقیماً از رویدادهای زنجیره بلوکی</li>
          <li>آموزش کامل: نصب کیف پول، افزودن شبکه پالیگان به MetaMask، خرید MATIC از صرافی‌ها (بایننس، کوین‌بیس، اوکی‌ایکس، کراکن)، افزودن نقدینگی در صرافی‌های غیرمتمرکز (DEX) مانند Uniswap و QuickSwap، و لیست کردن توکن در پلتفرم‌های پایش قیمت مانند CoinGecko و CoinMarketCap</li>
        </ul>

        <h2>شبکه پالیگان (Polygon)</h2>
        <p>PolyMint روی شبکه Polygon Mainnet کار می‌کند. مشخصات شبکه: نام Polygon Mainnet، آدرس RPC: https://polygon-rpc.com، شناسه زنجیره (Chain ID): 137، نماد: POL، مرورگر بلاک‌چین: https://polygonscan.com. برای ساخت توکن به توکن‌های MATIC یا POL برای پرداخت کارمزد گس و کارمزد ساخت نیاز دارید. MATIC را می‌توانید از صرافی‌های متمرکز مانند Binance، Coinbase، OKX و Kraken خریداری کنید و به شبکه Polygon منتقل نمایید.</p>

        <h2>پرسش‌های متداول</h2>
        <h3>آیا به کدنویسی نیاز دارم؟</h3>
        <p>خیر. PolyMint تمام بخش‌های فنی شامل استقرار قرارداد هوشمند ERC-20 را به صورت خودکار انجام می‌دهد. شما فقط فرم مشخصات توکن را پر می‌کنید.</p>
        <h3>توکن من روی کدام شبکه ساخته می‌شود؟</h3>
        <p>توکن شما روی شبکه Polygon Mainnet (پالیگان) ساخته می‌شود و یک توکن استاندارد ERC-20 است که با MetaMask، Trust Wallet و دیگر کیف پول‌های سازگار قابل استفاده است.</p>
        <h3>کارمزد ساخت چقدر است؟</h3>
        <p>کارمزد ساخت توکن ۱۲.۵ MATIC است. علاوه بر آن کارمزد گس (Gas) شبکه Polygon نیز برای پردازش تراکنش پرداخت می‌شود که بسیار پایین است.</p>
        <h3>توکن ساخته‌شده متعلق به چه کسی است؟</h3>
        <p>توکن مستقیماً در کیف پول شما ساخته می‌شود و مالکیت کامل آن با شماست. هیچ کلید خصوصی‌ای در پلتفرم ذخیره نمی‌شود و همه تراکنش‌ها در کیف پول شما امضا می‌شوند.</p>
        <h3>آیا می‌توانم توکن ساخته‌شده را بفروشم؟</h3>
        <p>بله. توکن ERC-20 شما قابل انتقال و فروش است. می‌توانید نقدینگی را در صرافی‌های غیرمتمرکز مانند Uniswap و QuickSwap اضافه کنید و توکن خود را در CoinGecko و CoinMarketCap ثبت کنید.</p>

        <h2>هشدارهای امنیتی</h2>
        <ul>
          <li>هرگز عبارت بازیابی (Seed Phrase) خود را با کسی به اشتراک نگذارید.</li>
          <li>هیچ‌کس از طرف تیم PolyMint با شما تماس خصوصی نمی‌گیرد.</li>
          <li>همیشه آدرس قرارداد را قبل از خرید تأیید کنید.</li>
        </ul>
